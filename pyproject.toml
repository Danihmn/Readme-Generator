[project]
name = "readme-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Danihmn", email = "daniel.bezerra.mult@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain>=1.4.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.12",
    "pygithub>=2.10.0",
]

[project.scripts]
readme-generator = "readme_generator:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
